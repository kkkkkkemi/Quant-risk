[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pd-validation-toolkit"
version = "0.1.0"
description = "Reproducible one-year PD development and independent out-of-time validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PD Toolkit Contributors"}]
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "reportlab>=4.2,<6",
  "PyYAML>=6.0,<7", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "build>=1.2,<2", "pypdf>=5,<7"]

[project.scripts]
pd-toolkit = "pdtoolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tmp", "output", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
