name: PD toolkit checks and reproducible evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=pdtoolkit --cov-report=term-missing --cov-report=xml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: package-and-coverage-${{ matrix.python-version }}
          path: |
            dist/*
            coverage.xml
  demonstration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps .
      - run: pd-toolkit suite --config configs/demo.yaml --output output/ci
      - run: pd-toolkit verify output/ci/baseline
      - run: python scripts/check_demo.py output/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pd-validation-reports-and-evidence
          path: output/ci/
          retention-days: 30
